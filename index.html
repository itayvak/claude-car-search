<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Search Results</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-body-tertiary">
<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h1 class="h3 mb-0">Car Search Results</h1>
    <div class="d-flex gap-2">
      <select id="sort" class="form-select form-select-sm">
        <option value="score">Sort: Score</option>
        <option value="reliability_score">Sort: Reliability</option>
        <option value="price">Sort: Price</option>
        <option value="km">Sort: Mileage</option>
        <option value="year">Sort: Year</option>
      </select>
      <button id="enableEdit" class="btn btn-sm btn-outline-secondary">Enable editing</button>
      <span id="editStatus" class="small text-body-secondary align-self-center"></span>
    </div>
  </div>

  <div id="loadError" class="alert alert-warning d-none">
    Can't read <code>cars.csv</code> directly from a file. Pick it here, or serve the folder
    (<code>python -m http.server</code>) and open <code>localhost:8000</code>.
    <input id="file" type="file" accept=".csv" class="form-control form-control-sm mt-2">
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Car</th><th>Year</th><th class="text-end">Price</th><th class="text-end">Km</th>
            <th>Hand</th><th>HP</th><th>Score</th><th>Reliability</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
let cars = [];
let fileHandle = null;
const $ = id => document.getElementById(id);
const num = v => Number(v) || 0;
const fmt = n => num(n).toLocaleString('en-US');
const CSV_COLUMNS = ['date_screened','token','url','manufacturer','model','sub_model','year','price',
  'km','hand','hp','gearbox','color','score','reliability_score','reliability_confidence',
  'reliability_summary','description','status'];
const STATUS_OPTIONS = ['', 'interested', 'not interested', 'contacted'];
const STATUS_ROW_CLASS = { interested: 'table-success', 'not interested': 'table-danger', contacted: 'table-info' };

async function save() {
  if (!fileHandle) { alert('Click "Enable editing" first and pick cars.csv.'); return; }
  const writable = await fileHandle.createWritable();
  await writable.write(Papa.unparse(cars, { columns: CSV_COLUMNS }));
  await writable.close();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function tone(v, hi, mid) { return v >= hi ? 'success' : v >= mid ? 'warning' : 'danger'; }

function render() {
  const key = $('sort').value;
  const asc = ['price', 'km'].includes(key);
  const list = [...cars].sort((a, b) => asc ? num(a[key]) - num(b[key]) : num(b[key]) - num(a[key]));

  const tbody = $('rows'); tbody.replaceChildren();
  list.forEach((c, i) => {
    const tr = el('tr', STATUS_ROW_CLASS[c.status] || '');
    const carCell = el('td');
    carCell.append(el('div', 'fw-semibold', `${c.manufacturer} ${c.model}`));
    const scoreCell = el('td');
    const bar = el('div', 'progress'); bar.style.height = '18px'; bar.style.minWidth = '80px';
    const fill = el('div', `progress-bar bg-${tone(num(c.score), 70, 55)}`, num(c.score).toFixed(1));
    fill.style.width = Math.min(100, num(c.score)) + '%';
    bar.append(fill); scoreCell.append(bar);

    const relCell = el('td');
    relCell.append(el('span', `badge text-bg-${tone(num(c.reliability_score), 7, 5)}`, `${c.reliability_score}/10`),
                   el('span', 'badge text-bg-light border ms-1', c.reliability_confidence));
    relCell.title = c.reliability_summary;

    const statusCell = el('td');
    const statusSelect = el('select', 'form-select form-select-sm');
    STATUS_OPTIONS.forEach(opt => statusSelect.append(new Option(opt || '—', opt)));
    statusSelect.value = c.status || '';
    statusSelect.addEventListener('change', e => { c.status = e.target.value; save(); render(); });
    statusCell.append(statusSelect);

    const linkCell = el('td');
    const a = el('a', 'btn btn-sm btn-outline-primary', 'Yad2');
    a.href = /^https:\/\/www\.yad2\.co\.il\//.test(c.url) ? c.url : '#';
    a.target = '_blank'; a.rel = 'noopener';
    linkCell.append(a);

    const cells = [carCell, el('td', '', c.year), el('td', 'text-end', '₪' + fmt(c.price)),
      el('td', 'text-end', fmt(c.km)), el('td', '', c.hand), el('td', '', c.hp), scoreCell, relCell, statusCell, linkCell];
    tr.append(...cells);
    tbody.append(tr);

    // detail row: summary + description
    const d = el('tr', 'table-light');
    const dc = el('td', 'small text-body-secondary'); dc.colSpan = 10;
    const id = 'rel-' + i;
    const btn = el('button', 'btn btn-sm btn-link p-0', 'Reliability summary');
    btn.type = 'button';
    btn.dataset.bsToggle = 'collapse'; btn.dataset.bsTarget = '#' + id;
    const box = el('div', 'collapse mt-1', c.reliability_summary); box.id = id;
    dc.append(btn, box);
    d.append(dc); tbody.append(d);
  });
}

function load(text) {
  cars = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
  $('loadError').classList.add('d-none');
  render();
}

$('sort').addEventListener('change', render);
$('file').addEventListener('change', e => e.target.files[0]?.text().then(load));
$('enableEdit').addEventListener('click', async () => {
  if (!window.showOpenFilePicker) { alert('Editing needs Chrome or Edge (File System Access API).'); return; }
  try {
    [fileHandle] = await window.showOpenFilePicker({ types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }] });
    $('editStatus').textContent = 'Editing: ' + fileHandle.name;
  } catch (e) { /* user cancelled */ }
});
fetch('cars.csv').then(r => { if (!r.ok) throw 0; return r.text(); }).then(load)
  .catch(() => $('loadError').classList.remove('d-none'));
</script>
</body>
</html>
